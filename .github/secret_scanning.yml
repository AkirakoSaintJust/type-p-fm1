# The vendored JUCE examples carry a public Firebase demo key in their Android
# google-services.json files. It is a client-side identifier, not a server
# secret. Keep the alerts off those demo assets and leave the JUCE source
# scanned.
paths-ignore:
  - "vendor/deps/juce-src/examples/Assets/**"
  - "vendor/deps/juce-src/examples/DemoRunner/Builds/Android/app/src/main/assets/**"
  - "vendor/deps/juce-src/extras/AudioPluginHost/Builds/Android/app/src/main/assets/**"
